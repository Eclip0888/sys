<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ study_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('study.index') }}"><span class="dot"></span>{{ study_name }}</a>
  {% if session.get('uid') %}<a class="link" href="{{ url_for('study.logout') }}">Log out</a>{% endif %}
</header>
<main class="wrap">
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="foot">Pamantasan ng Lungsod ng Muntinlupa · BS Computer Science thesis study</footer>
</body>
</html>
